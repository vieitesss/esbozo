<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>esbozo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>✏️</text></svg>" />
<link rel="stylesheet" href="editor.css" />
<script>
  // The page owns light and dark; the element only inherits the CSS variables.
  // It follows the system by default, live, until a person picks a theme.
  (() => {
    const media = matchMedia('(prefers-color-scheme: dark)');
    let chosen = null;
    const show = (theme) => {
      document.documentElement.dataset.theme = theme;
      const button = document.querySelector('.theme');
      if (button !== null) button.textContent = theme === 'dark' ? 'Light' : 'Dark';
    };
    show(media.matches ? 'dark' : 'light');
    media.addEventListener('change', (event) => {
      if (chosen === null) show(event.matches ? 'dark' : 'light');
    });
    document.addEventListener('DOMContentLoaded', () => {
      // The button exists only now, so the theme the page started with is what
      // labels it: a page that opened dark offers Light, not Dark.
      show(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
      document.querySelector('.theme').addEventListener('click', () => {
        chosen = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        show(chosen);
      });
    });
  })();
</script>
</head>
<body>
<esbozo-editor></esbozo-editor>
<button type="button" class="theme">Dark</button>
<script type="module" src="editor.js"></script>
</body>
</html>
