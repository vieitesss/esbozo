# ST1003 is one of staticcheck's non-default checks: `inherit` keeps the default
# set on and adds it, so `PNG` is not written `Png` in a Go name. PNG is not in
# staticcheck's own initialism list, so the list this module writes names it —
# `png` is a command `ez` answers.
checks = ["inherit", "ST1003"]
initialisms = ["inherit", "PNG"]
