name: check

# push runs satisfy scripts/main-ci-guard.mjs on merged branch heads; pull_request covers forks.
on:
  push:
  pull_request:

# GitHub Actions cancels or drops pending runs per concurrency group, so each main run gets its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # GitHub runners set CI, which makes test reporters emit ANSI colour codes.
  NO_COLOR: '1'
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local

jobs:
  # GitHub Actions has no workflow-level if, so each job skips same-repo pull_request runs already covered by push.
  check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Install the browser the suite launches
        run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm check

  e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Install the browser the suite launches
        run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm e2e
      - name: Read whether a retry passed a test
        id: e2e
        if: ${{ !cancelled() }}
        run: |
          flaky="$(node -e '
            let flaky = 0
            try {
              const read = require("node:fs").readFileSync
              const report = JSON.parse(read(".e2e/report.json", "utf8"))
              flaky = report?.run?.summary?.flaky ?? 0
            } catch {}
            process.stdout.write(String(flaky))
          ')"
          echo "flaky=$flaky" >> "$GITHUB_OUTPUT"
      # > 0 rather than != '0': GitHub Actions evaluates an unset step output as ''.
      - name: Keep the run's evidence
        if: ${{ failure() || steps.e2e.outputs.flaky > 0 }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            .e2e/
            !.e2e/cache/
          # actions/upload-artifact skips dot directories like .e2e/ by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  steps:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    strategy:
      # GitHub Actions cancels sibling matrix shards on the first failure by default.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          # actions/checkout fetches one commit by default; check:steps needs full history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Find the commit to walk from
        id: base
        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/') }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)
              if [ "$REF" = refs/heads/main ]; then
                base="$PUSH_BEFORE"
              else
                base="$(git merge-base origin/main HEAD)"
              fi
              ;;
            *) base='' ;;
          esac
          # GitHub sets event.before to all zeros on the push that creates a ref.
          if [[ "$base" =~ ^0+$ ]]; then base=''; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Check this shard of the commits
        if: ${{ steps.base.outputs.sha != '' }}
        run: pnpm check:steps "${{ steps.base.outputs.sha }}" --shard ${{ matrix.shard }}/4
