# The guardrail on every push and pull request: the same `pnpm check` a person
# runs, then the model-free browser suites. No key is in this workflow, so
# `pnpm e2e` is every suite in `package.json` that makes no model call, except
# `screenshots.e2e.ts`, which `pnpm e2e:shots` runs alone; `pnpm e2e:agent` is
# run by hand, where a key is.
#
# Two things it also does, both about a red run nobody can look at afterwards.
# It keeps its own evidence: a run that failed, and a run that only ended green
# because a retry passed, uploads `.e2e/` with the replay cache left out, so the
# error of the attempt that failed is still readable once the runner is gone.
# And it checks every commit, not only the tip: `pnpm check:steps` gives each
# commit the static half of `pnpm check` on its own, because a commit that is
# green only with the next one on top is not the green step `AGENTS.md` calls
# for.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm check:steps` walks commits, so it needs the one it starts from
          # and every commit between that one and the tip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The one file `pnpm e2e:linux` reads too, so the image and this run
          # install the same Node. `engines` stays the floor the project needs.
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser the suite launches
        run: pnpm exec e2e-web install chromium --with-deps
      # After the browser, not before it: `pnpm check` runs the node tests, and
      # `test/probe-editor.test.ts` launches a browser of its own.
      - run: pnpm check
      - run: pnpm e2e
      # After the browser checks, so a red commit verdict can never skip one of
      # them, and before the evidence, which is read only once both have run.
      #
      # The commit every commit is checked from, one rule per event. A red
      # `pnpm check` must not hide it: this run is where each commit's own
      # verdict is read, so the step runs whether or not the tip was green. A
      # tag push carries no branch commit of its own, so it is left out here
      # rather than on the step below, where a merge base could still go red.
      - name: Find the commit to walk from
        id: base
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')) }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT" in
            # What the pull request would land on.
            pull_request) base="$PR_BASE" ;;
            push)
              if [ "$REF" = refs/heads/main ]; then
                # Main's tip before this push, so only what was pushed is walked.
                base="$PUSH_BEFORE"
              else
                # Where this branch left main, so a branch that is behind main
                # still walks the commits it added instead of exiting 2.
                base="$(git merge-base origin/main HEAD)"
              fi
              ;;
            *) base='' ;;
          esac
          # All zeros is the push that created the ref: nothing came before it.
          if [[ "$base" =~ ^0+$ ]]; then base=''; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # Static checks only — typecheck, lint, knip, check-rules — so it needs no
      # browser of its own. `!cancelled()` is what gives each commit its verdict
      # even when `pnpm check` or `pnpm e2e` above already failed.
      - name: Check every commit on its own
        if: ${{ !cancelled() && steps.base.outputs.sha != '' }}
        run: pnpm check:steps "${{ steps.base.outputs.sha }}"
      # A test a retry passed is green for the run, and its first attempt's
      # error lives only in the report: nothing else in the log says it.
      - name: Read whether a retry passed a test
        id: e2e
        if: ${{ !cancelled() }}
        run: |
          # `flaky` sits at run.summary.flaky, under the report's top-level `run`.
          # A report that is absent, unparsable or without that field reads 0: this
          # step must never turn a green run red.
          flaky="$(node -e '
            let flaky = 0
            try {
              const read = require("node:fs").readFileSync
              const report = JSON.parse(read(".e2e/report.json", "utf8"))
              flaky = report?.run?.summary?.flaky ?? 0
            } catch {}
            process.stdout.write(String(flaky))
          ')"
          echo "flaky=$flaky" >> "$GITHUB_OUTPUT"
      # `> 0` and not `!= '0'`: an output the step never set reads as no flaky
      # test, not as one. Best-effort, because evidence is worth having and is
      # never worth the run: a failed upload must not turn a green run red.
      - name: Keep the run's evidence
        if: ${{ failure() || steps.e2e.outputs.flaky > 0 }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            .e2e/
            !.e2e/cache/
          # `.e2e/` is a dot directory, which the action skips unless told not
          # to; the exclusion above still leaves the replay cache behind.
          include-hidden-files: true
          # A red run is read within the week; the cache is not evidence.
          retention-days: 7
          if-no-files-found: ignore
